<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #0f3460;
            --accent: #e94560;
            --text: #eee;
            --text-dim: #8892b0;
            --user-bubble: #0f3460;
            --bot-bubble: #1a1a2e;
            --border: #2a2a4a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        /* ---- header ---- */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        header .model {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-dim);
            background: var(--surface2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* ---- messages ---- */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #messages::-webkit-scrollbar {
            width: 6px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .msg {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg.user {
            flex-direction: row-reverse;
        }

        .msg .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .msg.bot .avatar {
            background: var(--accent);
            color: #fff;
        }
        .msg.user .avatar {
            background: var(--surface2);
            color: var(--accent);
        }

        .msg .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
        }

        /* think 块的折叠样式 */
        .think-block {
            background: rgba(233, 69, 96, 0.08);
            border-left: 3px solid var(--accent);
            border-radius: 4px 8px 8px 4px;
            padding: 10px 14px;
            margin-bottom: 12px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .think-block summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
            user-select: none;
        }
        .think-block .think-body {
            white-space: pre-wrap;
        }
        .answer-area {
            white-space: pre-wrap;
        }

        .msg .bubble .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.5s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ---- input area ---- */
        footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            gap: 10px;
        }
        footer textarea {
            flex: 1;
            resize: none;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            min-height: 46px;
            max-height: 120px;
        }
        footer textarea:focus {
            border-color: var(--accent);
        }
        footer button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        footer button:hover {
            opacity: 0.85;
        }
        footer button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ---- thinking 状态 ---- */
        .thinking-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .thinking-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            animation: bounce 1.2s infinite;
        }
        .thinking-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .thinking-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <span class="dot"></span>
            <h1>LangGraph Chat</h1>
            <span class="model">qwen3.6:27b</span>
        </header>

        <div id="messages"></div>

        <footer>
            <textarea id="input" rows="1"
                placeholder="输入消息，Enter 发送，Shift+Enter 换行"
                oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
            <button id="sendBtn" onclick="send()">发送</button>
        </footer>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        let isStreaming = false;
        let currentBotBubble = null; // 当前正在流式写入的气泡 DOM

        // ============ 渲染函数 ============

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `
            <div class="avatar">U</div>
            <div class="bubble">${escapeHtml(text)}</div>
          `;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        /**
         * 创建一个空的 bot 气泡，返回该气泡的 DOM 元素。
         * 后端把模型输出拆成两条通道：
         *   thinking → 折叠的"思考过程"块（details）
         *   content  → 正文答案区
         * 这里只维护两个容器的懒创建与追加。
         */
        function createBotBubble() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `
            <div class="avatar">AI</div>
            <div class="bubble"><span class="thinking-indicator">
              <span></span><span></span><span></span>
            </span></div>
          `;
            messagesEl.appendChild(div);
            scrollToBottom();
            const bubbleEl = div.querySelector('.bubble');
            bubbleEl._thinkBody = null;   // details 里的思考正文容器
            bubbleEl._answerEl = null;    // 正式回答容器
            return bubbleEl;
        }

        function removeIndicator(bubbleEl) {
            const ind = bubbleEl.querySelector('.thinking-indicator');
            if (ind) ind.remove();
        }

        /** 懒创建"思考过程"折叠块，返回其正文容器 */
        function ensureThinkBlock(bubbleEl) {
            removeIndicator(bubbleEl);
            if (!bubbleEl._thinkBody) {
                const details = document.createElement('details');
                details.className = 'think-block';
                details.open = true;

                const summary = document.createElement('summary');
                summary.textContent = '🤔 思考过程';

                const body = document.createElement('div');
                body.className = 'think-body';

                details.appendChild(summary);
                details.appendChild(body);
                bubbleEl.insertBefore(details, bubbleEl.firstChild);
                bubbleEl._thinkBody = body;
            }
            return bubbleEl._thinkBody;
        }

        /** 懒创建"正式回答"容器 */
        function ensureAnswerEl(bubbleEl) {
            removeIndicator(bubbleEl);
            if (!bubbleEl._answerEl) {
                const div = document.createElement('div');
                div.className = 'answer-area';
                bubbleEl.appendChild(div);
                bubbleEl._answerEl = div;
            }
            return bubbleEl._answerEl;
        }

        /** thinking 通道：追加到折叠块（textContent 天然防注入） */
        function appendThinking(bubbleEl, text) {
            ensureThinkBlock(bubbleEl).textContent += text;
            scrollToBottom();
        }

        /** content 通道：追加到答案区，末尾带闪烁光标 */
        function appendAnswer(bubbleEl, text) {
            const ans = ensureAnswerEl(bubbleEl);
            ans.textContent += text;
            const oldCursor = ans.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            ans.appendChild(cursor);
            scrollToBottom();
        }

        /** 流结束时调用：去掉光标，固定最终渲染 */
        function finalizeBotBubble(bubbleEl) {
            const cursor = bubbleEl.querySelector('.cursor');
            if (cursor) cursor.remove();
            bubbleEl._thinkBody = null;
            bubbleEl._answerEl = null;
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
            return str.replace(/[&<>"]/g, c => map[c]);
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ============ SSE 流式交互 ============

        async function send() {
            const text = inputEl.value.trim();
            if (!text || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = '';

            addUserMessage(text);
            currentBotBubble = createBotBubble();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 按 SSE 双换行分割事件
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop(); // 剩余不完整事件放回 buffer

                    for (const part of parts) {
                        if (!part.trim()) continue;
                        // 提取 data: 行
                        const lines = part.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const payload = JSON.parse(line.slice(6));
                                if (payload.type === 'done') {
                                    // 流结束
                                    finalizeBotBubble(currentBotBubble);
                                    currentBotBubble = null;
                                } else if (payload.type === 'thinking') {
                                    // 思考过程 → 折叠块
                                    appendThinking(currentBotBubble, payload.content);
                                } else if (payload.type === 'content') {
                                    // 正式回答 → 答案区
                                    appendAnswer(currentBotBubble, payload.content);
                                } else if (payload.type === 'error') {
                                    appendAnswer(currentBotBubble, `\n\n❌ ${payload.content}`);
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                if (currentBotBubble) {
                    appendAnswer(currentBotBubble, `\n\n❌ 请求失败: ${err.message}`);
                    finalizeBotBubble(currentBotBubble);
                    currentBotBubble = null;
                }
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ============ 键盘事件 ============

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // 页面加载后聚焦输入框
        inputEl.focus();
    </script>
</body>
</html>
