<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangGraph Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #0f3460;
            --accent: #e94560;
            --text: #eee;
            --text-dim: #8892b0;
            --user-bubble: #0f3460;
            --bot-bubble: #1a1a2e;
            --border: #2a2a4a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        /* ---- header ---- */
        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        header .model {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-dim);
            background: var(--surface2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* ---- messages ---- */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        #messages::-webkit-scrollbar {
            width: 6px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .msg {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg.user {
            flex-direction: row-reverse;
        }

        .msg .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .msg.bot .avatar {
            background: var(--accent);
            color: #fff;
        }
        .msg.user .avatar {
            background: var(--surface2);
            color: var(--accent);
        }

        .msg .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.bot .bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }
        .msg.user .bubble {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
        }

        /* think 块的折叠样式 */
        .think-block {
            background: rgba(233, 69, 96, 0.08);
            border-left: 3px solid var(--accent);
            border-radius: 4px 8px 8px 4px;
            padding: 10px 14px;
            margin-bottom: 12px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .think-block summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
            user-select: none;
        }

        .msg .bubble .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.5s step-end infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ---- input area ---- */
        footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            gap: 10px;
        }
        footer textarea {
            flex: 1;
            resize: none;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            min-height: 46px;
            max-height: 120px;
        }
        footer textarea:focus {
            border-color: var(--accent);
        }
        footer button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        footer button:hover {
            opacity: 0.85;
        }
        footer button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ---- thinking 状态 ---- */
        .thinking-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .thinking-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
            animation: bounce 1.2s infinite;
        }
        .thinking-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .thinking-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <span class="dot"></span>
            <h1>LangGraph Chat</h1>
            <span class="model">qwen3.6:27b</span>
        </header>

        <div id="messages"></div>

        <footer>
            <textarea id="input" rows="1"
                placeholder="输入消息，Enter 发送，Shift+Enter 换行"
                oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
            <button id="sendBtn" onclick="send()">发送</button>
        </footer>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        let isStreaming = false;
        let currentBotBubble = null; // 当前正在流式写入的气泡 DOM

        // ============ 渲染函数 ============

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.innerHTML = `
            <div class="avatar">U</div>
            <div class="bubble">${escapeHtml(text)}</div>
          `;
            messagesEl.appendChild(div);
            scrollToBottom();
        }

        /**
         * 创建一个空的 bot 气泡，返回该气泡的 DOM 元素，
         * 后续通过 appendToBotBubble() 往里追加内容。
         */
        function createBotBubble() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `
            <div class="avatar">AI</div>
            <div class="bubble"><span class="thinking-indicator">
              <span></span><span></span><span></span>
            </span></div>
          `;
            messagesEl.appendChild(div);
            scrollToBottom();
            return div.querySelector('.bubble');
        }

        /**
         * 向 bot 气泡追加文本（解析 <think> 折叠块）。
         * 调用时机：SSE 每收到一个 chunk。
         */
        function appendToBotBubble(bubbleEl, newContent) {
            // 移除 loading 动画（如果还在）
            const indicator = bubbleEl.querySelector('.thinking-indicator');
            if (indicator) indicator.remove();

            // 追加原始内容
            bubbleEl._rawText = (bubbleEl._rawText || '') + newContent;

            // 重新渲染：解析 <think>...</think> 为折叠块
            const rendered = renderMarkdown(bubbleEl._rawText);
            bubbleEl.innerHTML = rendered;

            // 如果流未结束，追加闪烁光标
            bubbleEl.innerHTML += '<span class="cursor"></span>';

            scrollToBottom();
        }

        /** 流结束时调用：去掉光标，固定最终渲染 */
        function finalizeBotBubble(bubbleEl) {
            bubbleEl.innerHTML = renderMarkdown(bubbleEl._rawText || '');
            bubbleEl._rawText = '';
        }

        /**
         * 将包含 <think> 标签的文本渲染为 HTML：
         * - <think>...内容...</think> 折叠为 <details>
         * - 其余文本保留
         */
        function renderMarkdown(text) {
            // 保护 HTML 实体
            let html = escapeHtml(text);

            // 将 <think>...</think> 替换为折叠块
            html = html.replace(
                /&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g,
                (_, content) =>
                `<details class="think-block" open><summary>🤔 思考过程</summary>${content.trim()}</details>`
            );

            return html;
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
            return str.replace(/[&<>"]/g, c => map[c]);
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ============ SSE 流式交互 ============

        async function send() {
            const text = inputEl.value.trim();
            if (!text || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = '';

            addUserMessage(text);
            currentBotBubble = createBotBubble();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 按 SSE 双换行分割事件
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop(); // 剩余不完整事件放回 buffer

                    for (const part of parts) {
                        if (!part.trim()) continue;
                        // 提取 data: 行
                        const lines = part.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const payload = JSON.parse(line.slice(6));
                                if (payload.done) {
                                    // 流结束
                                    finalizeBotBubble(currentBotBubble);
                                    currentBotBubble = null;
                                } else {
                                    appendToBotBubble(currentBotBubble, payload.content);
                                }
                            }
                        }
                    }
                }
            } catch (err) {
                if (currentBotBubble) {
                    appendToBotBubble(currentBotBubble, `\n\n❌ 请求失败: ${err.message}`);
                    finalizeBotBubble(currentBotBubble);
                    currentBotBubble = null;
                }
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        // ============ 键盘事件 ============

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // 页面加载后聚焦输入框
        inputEl.focus();
    </script>
</body>
</html>
