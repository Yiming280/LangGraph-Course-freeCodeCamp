# Data Agent 后端 —— 与前端联调用
#   docker compose up -d --build
# 所有业务配置从外部 .env 或 environment 注入，改完 docker compose up -d 生效，无需重 build。
services:
  dataagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataagent:latest
    container_name: dataagent
    env_file:
      - .env              # 外部配置主入口（复用现有 .env，含真实密钥，勿提交）
    environment:
      DATA_AGENT_PORT: "8001"
      # 需要覆盖 .env 里的某项时，在这里显式写，例如：
      # OLLAMA_HOST: http://10.8.1.106:11434
      # LOG_DIRS: /logs/app,/logs/nginx
    ports:
      - "8001:8001"
    volumes:
      # —— 运行时状态（持久化，entrypoint 软链到 /data）——
      - ./data:/data                         # agent_memory.sqlite / settings.json / error_log.jsonl
      - ./data/charts:/app/static/charts     # 生成的图表 PNG
      - ./data/reports:/app/static/reports   # 生成的报告
      # —— 知识库 / 外部数据（挂载而非打进镜像，改内容不用重 build）——
      - ./domain:/app/domain                 # 生产数据字典 + 供料拓扑
      - ../Agents:/Agents                    # RAG 美股知识库（chroma 向量库 + PDF）
      # —— 本机日志（可选）：挂宿主机日志目录，LOG_DIRS 指向容器内挂载点 ——
      # - ./logs:/logs
    restart: unless-stopped
