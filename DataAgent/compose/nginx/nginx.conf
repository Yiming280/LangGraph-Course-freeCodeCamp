# user  nobody;

# 工作进程数
worker_processes  auto;

# 错误日志
error_log  /var/log/nginx/error.log;
error_log  /var/log/nginx/error.notice.log  notice;
error_log  /var/log/nginx/error.debug.log  debug;

events {
    # 单个worker最大连接数（提升至10240，支持更高并发）
    worker_connections  10240;
    # 启用多连接接受（减少连接建立延迟）
    multi_accept        on;
    # 使用epoll模型（Linux下最优IO模型）
    use                 epoll;
}


http {
    # 引入MIME类型定义
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式：优化字段，增加响应时间和 upstream 信息
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time ut=$upstream_response_time';
    # 启用访问日志
    access_log  /var/log/nginx/access.log  main;

    # 性能优化：启用高效文件传输
    sendfile        on;
    # 配合sendfile使用，减少网络包数量
    tcp_nopush      on;
    # 减少延迟（小数据传输更优）
    tcp_nodelay     on;

    # 连接超时：客户端连接保持时间（默认65s）
    keepalive_timeout  65;
    # 客户端请求体读取超时（防止恶意慢请求）
    client_body_timeout  10s;
    # 发送响应超时
    send_timeout  10s;

    # 启用gzip压缩（减少传输数据量）
    gzip  on;
    gzip_vary on;  # 告诉客户端有压缩版本
    gzip_proxied any;  # 对代理请求也压缩
    gzip_comp_level 5;  # 压缩级别（1-9，5平衡性能和压缩率）
    gzip_buffers 16 8k;  # 压缩缓冲区
    gzip_http_version 1.1;  # 支持的HTTP版本
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;  # 需压缩的MIME类型

    # 客户端最大请求体大小（防止大文件攻击，根据业务调整）
    client_max_body_size 1000M;

    # 代理通用配置（抽取重复配置，减少冗余）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;  # 增加协议头（http/https）
    proxy_redirect off;
    proxy_buffering on;
    # 代理缓冲区优化（减少IO次数）
    proxy_buffer_size 16k;
    proxy_buffers 4 64k;
    # 代理超时设置（避免连接挂起）
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 安全头配置（防御XSS、点击劫持等攻击）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;  # 限制iframe嵌入
    add_header X-XSS-Protection "1; mode=block" always;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 若用HTTPS，启用HSTS

    server {
        # 监听IPv4和IPv6的80端口
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        # 字符集（默认utf-8，显式声明）
        charset utf-8;

        # 前端静态资源配置
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;  # 支持SPA路由

            # 静态资源缓存优化（长缓存不变资源）
            expires 1d;  # 图片、CSS、JS等缓存1天
            add_header Cache-Control "public, max-age=86400" always;
        }


        # api
        location /api/v1/ {
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Proxy-Auth fba4ebd5-3fe3-4186-b821-0223ad75e1e3;
            proxy_set_header Connection "";

            # SSE：禁缓冲、禁压缩、延长空闲超时
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_pass http://ai-dataagent-server:8001/;  # 去掉 /api/v1 前缀，保留查询参数
        }

        # 错误页面配置（保持不变）
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # 限制请求方法（仅允许必要的HTTP方法）
        if ($request_method !~ "^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$") {
            return 405;
        }
    }

    # 引入其他配置文件
    include conf.d/*.conf;
}
