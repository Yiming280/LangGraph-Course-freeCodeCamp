networks:
  ai-net:
    name: ai-net
    ipam:
      config:
        - subnet: 10.10.11.0/24

services:
  ai-nginx:
    image: nginx:1.20.2
    container_name: ai-nginx
    hostname: ai-nginx-host
    networks:
      ai-net:
        ipv4_address: 10.10.11.4
    ports:
      - "3000:3000"
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker 20.10+ 支持访问宿主机
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cert:/etc/nginx/cert
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/logs:/var/log/nginx
    restart: always

  # 后端服务
  ai-dataagent-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ai-dataagent-server:latest
    container_name: ai-dataagent-server
    hostname: ai-dataagent-server-host
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker 20.10+ 支持
    networks:
      ai-net:
        ipv4_address: 10.10.11.5
    ports:
      - "8001:8001"
    environment:
      - TZ=Asia/Shanghai
      - DATA_AGENT_PORT=8001
    env_file:
      - ../.env              # 外部配置主入口（复用现有 .env，含真实密钥，勿提交）
    volumes:
      # —— 代码（开发期热更新）：挂载上级目录（Dockerfile/app.py 所在）到 /app，改代码只需 restart ——
      - ../:/app
      # —— 运行时状态（持久化，entrypoint 软链到 /data）——
      - ../data:/data                                  # agent_memory.sqlite / settings.json / error_log.jsonl
      - ../data/charts:/app/static/charts              # 生成的图表 PNG
      - ../data/reports:/app/static/reports            # 生成的报告
      # —— 知识库 / 外部数据（挂载而非打进镜像，改内容不用重 build）——
      - ../domain:/app/domain                          # 生产数据字典 + 供料拓扑
      # —— 本机日志：挂宿主机日志目录，LOG_DIRS 指向容器内挂载点 ——
      - ../logs:/logs
    restart: unless-stopped